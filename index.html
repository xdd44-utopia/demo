<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rhino MCP</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #2a2a2a;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        color: #ccc;
      }
      #layout {
        display: flex;
        height: 100vh;
      }

      /* ── Viewport ── */
      #viewport {
        flex: 1;
        position: relative;
        overflow: hidden;
      }
      #viewport canvas {
        display: block;
      }

      /* ── Panel ── */
      #panel {
        width: 320px;
        min-width: 280px;
        display: flex;
        flex-direction: column;
        background: #1c1c1c;
        border-left: 1px solid #3a3a3a;
      }
      #panel-header {
        padding: 8px 10px 8px 10px;
        font-size: 11px;
        font-weight: 700;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        border-bottom: 1px solid #2e2e2e;
        background: #222;
        user-select: none;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #panel-title {
        flex: 1;
      }
      .header-btn {
        padding: 3px 9px;
        background: transparent;
        color: #5a8ab0;
        border: 1px solid #2a4a6a;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 0.03em;
        transition: background 0.12s, border-color 0.12s, color 0.12s;
        font-family: inherit;
        flex-shrink: 0;
      }
      .header-btn:hover { background: #1a3550; border-color: #3a70b0; color: #7ab8e8; }
      #settings-btn { font-size: 13px; padding: 2px 7px; }

      /* ── Settings drawer ── */
      #settings-drawer {
        display: none;
        flex-direction: column;
        gap: 10px;
        padding: 10px 14px 12px;
        background: #1a1a1a;
        border-bottom: 1px solid #2e2e2e;
      }
      #settings-drawer.open { display: flex; }
      #quality-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #quality-row .drawer-hint { flex-shrink: 0; }
      .drawer-hint {
        font-size: 11px;
        color: #555;
        user-select: none;
      }
      #mesh-quality {
        flex: 1;
        -webkit-appearance: none;
        height: 3px;
        background: #333;
        border-radius: 2px;
        outline: none;
        cursor: pointer;
      }
      #mesh-quality::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #4a7aaa;
        cursor: pointer;
        transition: background 0.12s;
      }
      #mesh-quality::-webkit-slider-thumb:hover { background: #5a9acc; }
      #quality-label {
        font-size: 11px;
        color: #7ab8d8;
        min-width: 40px;
        text-align: right;
        user-select: none;
      }
      #sync-btn {
        align-self: flex-start;
        padding: 5px 14px;
        background: #162840;
        color: #7ab8d8;
        border: 1px solid #2a5070;
        border-radius: 5px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 0.04em;
        transition: background 0.12s, border-color 0.12s;
        font-family: inherit;
      }
      #sync-btn:hover { background: #1e3a58; border-color: #3a72a0; }
      #sync-btn:active { background: #102030; }
      #sync-btn:disabled { opacity: 0.4; cursor: default; }

      /* ── Conversation list ── */
      #conv-list {
        overflow-y: auto;
        border-bottom: 1px solid #2e2e2e;
        background: #1a1a1a;
        flex-shrink: 0;
        max-height: 148px;
      }
      #conv-list::-webkit-scrollbar { width: 4px; }
      #conv-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
      .conv-item {
        display: flex;
        align-items: center;
        padding: 0 10px 0 14px;
        height: 37px;
        cursor: pointer;
        font-size: 12px;
        color: #777;
        border-bottom: 1px solid #222;
        user-select: none;
        gap: 6px;
      }
      .conv-item:hover { background: #222; color: #aaa; }
      .conv-item.active { background: #162840; color: #7ab8e8; }
      .conv-item.active:hover { background: #1a3050; }
      .conv-title {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .conv-delete {
        opacity: 0;
        font-size: 15px;
        color: #555;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0 2px;
        line-height: 1;
        font-family: inherit;
        flex-shrink: 0;
        transition: color 0.1s;
      }
      .conv-item:hover .conv-delete { opacity: 1; }
      .conv-delete:hover { color: #e07070; }

      /* ── Messages ── */
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 14px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        scroll-behavior: smooth;
      }
      #messages::-webkit-scrollbar { width: 5px; }
      #messages::-webkit-scrollbar-track { background: transparent; }
      #messages::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 3px; }
      .placeholder-msg {
        margin: auto;
        text-align: center;
        color: #484848;
        font-size: 12px;
        line-height: 1.7;
        user-select: none;
      }
      .message {
        padding: 9px 12px;
        border-radius: 7px;
        font-size: 13px;
        line-height: 1.55;
        max-width: 100%;
        word-wrap: break-word;
        white-space: pre-wrap;
      }
      .message.user {
        background: #1f3c5a;
        color: #b8d4ec;
        align-self: flex-end;
        border-bottom-right-radius: 2px;
      }
      .message.assistant {
        background: #262626;
        color: #bbb;
        border: 1px solid #333;
        align-self: flex-start;
        border-bottom-left-radius: 2px;
      }

      /* ── Input area ── */
      #input-area {
        padding: 10px 12px 12px;
        border-top: 1px solid #2e2e2e;
        background: #202020;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #message-input {
        width: 100%;
        background: #181818;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        color: #ccc;
        font-size: 13px;
        font-family: inherit;
        padding: 8px 10px;
        resize: none;
        outline: none;
        line-height: 1.5;
        min-height: 62px;
        max-height: 130px;
        transition: border-color 0.15s;
      }
      #message-input::placeholder { color: #484848; }
      #message-input:focus { border-color: #4a7daa; }
      #input-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .input-hint {
        font-size: 11px;
        color: #444;
        user-select: none;
      }
      #send-btn {
        padding: 6px 18px;
        background: #1f4e78;
        color: #a8cceb;
        border: 1px solid #2d6098;
        border-radius: 5px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 0.04em;
        min-width: 72px;
        transition: background 0.12s, border-color 0.12s;
        font-family: inherit;
      }
      #send-btn:hover { background: #265e90; border-color: #3a72b0; }
      #send-btn:active { background: #1a4268; }
      #send-btn:disabled { opacity: 0.4; cursor: default; }
      #send-btn.loading:disabled { opacity: 1; }

      /* ── Selection badge ── */
      #selection-badge {
        display: none;
        font-size: 11px;
        color: #c0a060;
        background: rgba(60, 45, 0, 0.35);
        border: 1px solid #6a5020;
        border-radius: 4px;
        padding: 3px 8px;
        user-select: none;
      }

      /* ── Zoom Selected button ── */
      #zoom-selected {
        display: none;
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        padding: 5px 16px;
        background: rgba(20, 40, 60, 0.88);
        color: #8ab8d8;
        border: 1px solid #3a6080;
        border-radius: 5px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        z-index: 5;
        backdrop-filter: blur(4px);
        letter-spacing: 0.04em;
        font-family: inherit;
        transition: background 0.12s, border-color 0.12s;
      }
      #zoom-selected:hover { background: rgba(30, 55, 85, 0.95); border-color: #4a80a0; }

      /* ── Debug panel ── */
      #debug-panel {
        position: absolute;
        top: 10px;
        left: 10px;
        width: 340px;
        max-height: calc(100vh - 40px);
        background: rgba(10, 10, 10, 0.88);
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        font-family: 'Consolas', 'Cascadia Code', monospace;
        font-size: 11px;
        z-index: 10;
        backdrop-filter: blur(4px);
      }
      #debug-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px;
        border-bottom: 1px solid #2e2e2e;
        color: #666;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        user-select: none;
        cursor: pointer;
      }
      #debug-header:hover { color: #999; }
      #debug-toggle { color: #555; font-size: 10px; }
      #debug-body {
        overflow-y: auto;
        padding: 8px 10px;
        color: #7ab8d8;
        white-space: pre-wrap;
        word-break: break-all;
        line-height: 1.5;
        max-height: calc(100vh - 80px);
      }
      #debug-body::-webkit-scrollbar { width: 4px; }
      #debug-body::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
      #debug-body.error { color: #e07070; }
    </style>
  </head>
  <body>
    <div id="layout">
      <div id="viewport">
        <button id="zoom-selected">Zoom Selected</button>
        <div id="debug-panel">
          <div id="debug-header">
            <span>Debug — Rhino response</span>
            <span id="debug-toggle">▼</span>
          </div>
          <pre id="debug-body">Waiting for first sync…</pre>
        </div>
      </div>

      <div id="panel">
        <div id="panel-header">
          <button id="settings-btn" class="header-btn" title="Settings">⚙</button>
          <span id="panel-title">AI Assistant</span>
          <button id="new-conv-btn" class="header-btn">+ New</button>
        </div>

        <div id="settings-drawer">
          <div id="quality-row">
            <span class="drawer-hint">Mesh quality</span>
            <input type="range" id="mesh-quality" min="1" max="5" value="3" step="1">
            <span id="quality-label">Medium</span>
          </div>
          <button id="sync-btn" title="Pull current scene from Rhino">&#x21bb; Sync scene</button>
        </div>

        <div id="conv-list"></div>

        <div id="messages">
          <p class="placeholder-msg">
            Describe what you'd like to create<br>or modify in the scene.
          </p>
        </div>

        <div id="input-area">
          <div id="selection-badge"></div>
          <textarea
            id="message-input"
            placeholder="e.g. Add a red sphere at position 2, 0, 0…"
          ></textarea>
          <div id="input-row">
            <span class="input-hint">Shift+Enter for new line</span>
            <button id="send-btn">Send</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
